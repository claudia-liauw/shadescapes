<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShadeScapes</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="header">
    <div>
      <h1>ShadeScapes</h1>
      <p class="subtitle">Pedestrian shade index for a Singapore street corridor</p>
    </div>
    <div class="actions">
      <button id="score-btn" type="button">Run Shade Scoring</button>
      <p id="status" class="status" aria-live="polite"></p>
    </div>
  </header>

  <main class="map">
    <div id="map-container">{{ map_html|safe }}</div>
    <div class="map-legend" aria-label="Shade index legend">
      <strong>Shade index</strong><br />
      <span class="legend-swatch legend-high">&#9679;</span> High (&ge; 0.7)<br />
      <span class="legend-swatch legend-medium">&#9679;</span> Medium (0.4–0.7)<br />
      <span class="legend-swatch legend-low">&#9679;</span> Low (&lt; 0.4)<br />
      <span class="legend-swatch legend-unscored">&#9679;</span> Not scored
    </div>
  </main>

  <script>
    const button = document.getElementById("score-btn");
    const status = document.getElementById("status");
    const scoreMessage = sessionStorage.getItem("scoreMessage");

    if (scoreMessage) {
      status.textContent = scoreMessage;
      status.className = "status status-success";
      sessionStorage.removeItem("scoreMessage");
    }

    button.addEventListener("click", async () => {
      button.disabled = true;
      button.textContent = "Scoring…";
      status.textContent = "";
      status.className = "status";

      try {
        const response = await fetch("/api/score", { method: "POST" });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.detail || "Scoring failed");
        }
        sessionStorage.setItem("scoreMessage", data.message);
        window.location.reload();
      } catch (error) {
        status.textContent = error.message;
        status.className = "status status-error";
        button.disabled = false;
        button.textContent = "Run Shade Scoring";
      }
    });
  </script>
</body>
</html>
